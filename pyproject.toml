[project]
name = "lesia"
version = "0.1.8"
description = "A library for automated directory translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.16.1",
    "httpx>=0.28.1",
    "jupytext>=1.17.1",
    "linkify-it-py>=2.0.3",
    "loguru>=0.7.3",
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "pydantic>=2.11.5",
    "pylatexenc>=2.10",
    "tree-sitter-language-pack>=0.9.0",
    "typer>=0.20.0",
    "typst-syntax>=0.1.6",
    "unified-model-caller==0.2.5",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]  # was: ["setuptools", "setuptools-scm"]
build-backend = "maturin"          # was: "setuptools.build_meta"

[dependency-groups]
dev = [
    "build>=1.4.2",
    "pytest>=7.4.4",
    "maturin>=1.14.1",
]

[project.scripts]
lesia = "cli:app"

[tool.setuptools] 
py-modules = ["lesia", "cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
